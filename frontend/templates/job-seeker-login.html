<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Seeker login | OpenLane</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="/" aria-label="OpenLane home">
            <span class="logo">//</span>
            <span>OpenLane</span>
        </a>
        <span class="top-note">Job Seeker access</span>
    </header>

    <main>
        <section class="auth-card">
            <a class="back-link" href="/">← Change account type</a>

            <p class="eyebrow">Job Seeker account</p>
            <h1>Welcome back</h1>
            <p class="intro">
                Log in to explore opportunities and continue building your skills.
            </p>

            <div class="notice error" id="form-error" role="alert"></div>
            <form class="form" action="/job-seeker/login" method="POST" data-ajax-submit>
                <div class="form-group">
                    <label for="identifier">Email or phone number</label>
                    <input
                        type="text"
                        id="identifier"
                        name="identifier"
                        autocomplete="username"
                        placeholder="Email or phone number"
                        required
                    >
                </div>

                <div class="password-label-row">
                    <label for="password">Password</label>

                    <a href="/forgot-password?type=job_seeker" class="forgot-password-link">
                        Forgot password? Reset it
                    </a>
                </div>
                <div class="password-input-wrap">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        placeholder="Enter password"
                        data-password-field
                        required
                    >
                    <button class="password-toggle" type="button" data-toggle-password="password" aria-label="Show password">Show</button>
                </div>
                <div id="form-message" role="alert" aria-live="polite"></div>
                <button class="btn" type="submit">Log in as Job Seeker</button>
            
            </form>

            <p class="link-row">
                New to OpenLane?
                <a href="/job-seeker/register">Create a Job Seeker account</a>
            </p>
        </section>
    </main>

    <footer class="footer">
        OpenLane · Connecting people with opportunities
    </footer>
    <script src="/js/forms.js"></script>
</body>
</html>
