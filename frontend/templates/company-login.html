<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Company login | OpenLane</title>
    <link rel="stylesheet" href="/css/styles.css">
    <meta name="theme-color" content="#0a7a4b">
    <meta name="description" content="OpenLane helps you build digital skills, track your progress and find local work.">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icons/favicon-32.png" type="image/png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="OpenLane">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <script src="/js/pwa.js" defer></script>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="/" aria-label="OpenLane home">
            <span class="logo">//</span>
            <span>OpenLane</span>
        </a>
        <span class="top-note">Company access</span>
    </header>

    <main>
        <section class="auth-card">
            <a class="back-link" href="/">← Change account type</a>

            <p class="eyebrow">Company account</p>
            <h1>Welcome back</h1>
            <p class="intro">
                Log in to manage your company and its opportunities.
            </p>

            <div class="notice error" id="form-error" role="alert"></div>
            <form class="form" action="/company/login" method="POST" data-ajax-submit>
                <div class="form-group">
                    <label for="identifier">Email or phone number</label>
                    <input
                        type="text"
                        id="identifier"
                        name="identifier"
                        autocomplete="username"
                        placeholder="Email or phone number"
                        required
                    >
                </div>
                 <div class="password-label-row">
                    <label for="password">Password</label>

                    <a href="/forgot-password?type=company" class="forgot-password-link">
                        Forgot password? Reset it
                    </a>
                </div>
                <div class="password-input-wrap">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        placeholder="Enter password"
                        data-password-field
                        required
                    >
                    <button class="password-toggle" type="button" data-toggle-password="password" aria-label="Show password">Show</button>
                </div>
                <div id="form-message" role="alert" aria-live="polite"></div>
                <button class="btn" type="submit">Log in as Company</button>
            </form>

            <p class="link-row">
                Don't have a company account?
                <a href="/company/register">Create one</a>
            </p>
        </section>
    </main>

    <footer class="footer">
        OpenLane · Connecting people with opportunities
    </footer>
    <script src="/js/forms.js"></script>
</body>
</html>
