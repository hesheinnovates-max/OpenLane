<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Browse jobs | OpenLane</title>
    <link rel="stylesheet" href="/css/styles.css">
    <meta name="theme-color" content="#0a7a4b">
    <meta name="description" content="OpenLane helps you build digital skills, track your progress and find local work.">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icons/favicon-32.png" type="image/png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="OpenLane">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <script src="/js/pwa.js" defer></script>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="/" aria-label="OpenLane home">
            <span class="logo">//</span>
            <span>OpenLane</span>
        </a>
        <nav class="top-actions" aria-label="Account" id="top-actions">
            <a class="top-link" href="/job-seeker/login">Job Seeker log in</a>
        </nav>
    </header>

    <main class="dash">
        <div class="dash-header">
            <div>
                <p class="eyebrow">Opportunities</p>
                <h1>Find work near you</h1>
                <p class="intro">Browse open jobs, read what each company needs and apply or contact them directly.</p>
            </div>
            <button class="btn btn-inline btn-secondary" type="button" data-install-app hidden>📲 Install app</button>
        </div>

        <div class="card">
            <div class="filters">
                <input type="search" id="job-search" placeholder="Search title, company or skill" aria-label="Search jobs">
                <select id="job-type-filter" aria-label="Filter by job type">
                    <option value="">All job types</option>
                </select>
                <input type="search" id="job-location-filter" placeholder="Location" aria-label="Filter by location">
            </div>
            <p class="small muted" id="job-count" style="margin-bottom:12px"></p>
            <div class="list" id="jobs-list"><div class="loading">Loading…</div></div>
        </div>
    </main>

    <div class="modal" id="job-modal" role="dialog" aria-modal="true" aria-labelledby="job-modal-title">
        <div class="modal-box">
            <button class="modal-close" type="button" aria-label="Close">×</button>
            <div id="job-modal-body"></div>
        </div>
    </div>

    <footer class="footer">OpenLane · Connecting people with opportunities</footer>
    <script src="/js/app.js"></script>
    <script src="/js/jobs-shared.js"></script>
    <script src="/js/jobs.js"></script>
</body>
</html>
